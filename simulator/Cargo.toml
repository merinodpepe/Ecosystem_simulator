[package]
name = "ecosystem_simulator_rs"
version = "0.2.0"
edition = "2021"
description = "Agent-based ecosystem simulator for Parc Natural de l'Alt Pirineu (Rust version)"

[features]
default = []
geo = ["dep:gdal"]

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ordered-float = "4"
gdal = { version = "0.17", optional = true }
csv = "1.4.0"
rayon = "1.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
